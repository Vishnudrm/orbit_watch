networks:
  orbitwatch-net:
    driver: bridge

volumes:
  delta-data:
    driver: local

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: orbitwatch-zookeeper
    networks:
      - orbitwatch-net
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_PORT}
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_PORT}:${ZOOKEEPER_PORT}"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: orbitwatch-kafka
    networks:
      - orbitwatch-net
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT}:${KAFKA_PORT}"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:${ZOOKEEPER_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:${KAFKA_INTERNAL_PORT},OUTSIDE://localhost:${KAFKA_PORT}
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: orbitwatch-kafka-ui
    networks:
      - orbitwatch-net
    depends_on:
      - kafka
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: orbitwatch
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:${KAFKA_INTERNAL_PORT}
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:${ZOOKEEPER_PORT}

  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: orbitwatch-spark-master
    networks:
      - orbitwatch-net
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_MASTER_HOST: spark-master
    ports:
      - "${SPARK_MASTER_UI_PORT}:8080"
      - "${SPARK_MASTER_PORT}:7077"
    volumes:
      - ./data/delta:/opt/delta
      - ./transforms:/opt/transforms
      - ./producers:/opt/producers
      - ./consumers:/opt/consumers

  spark-worker:
    build:
      context: ./spark
      dockerfile: Dockerfile
    container_name: orbitwatch-spark-worker
    networks:
      - orbitwatch-net
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
    volumes:
      - ./data/delta:/opt/delta
      - ./transforms:/opt/transforms
